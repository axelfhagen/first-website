<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Axel Friberg Hagen</title>
    <meta name="description" content="Axel Friberg Hagen — physics and math student from Norway working with AI and statistics. Projects and a photo log from travels." />
    <meta name="author" content="Axel Friberg Hagen" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111110" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/icons/frog/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/frog/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="/icons/frog/logo192.png" />
    <link rel="manifest" href="/manifest.json" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Axel Friberg Hagen" />
    <meta property="og:title" content="Axel Friberg Hagen" />
    <meta property="og:description" content="Physics and math student from Norway working with AI and statistics. Projects and a photo log from travels." />
    <meta property="og:image" content="/img/site/og.jpg" />
    <meta property="og:image:alt" content="Portrait of Axel Friberg Hagen" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="nb_NO" />
    <meta name="twitter:card" content="summary" />

    <!-- Apply the saved/system theme and language before first paint (no flash). Keys must match src/theme and src/i18n. -->
    <script>
      (function () {
        var d = document.documentElement;
        try {
          var t = localStorage.getItem('theme');
          if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          d.dataset.theme = t;
          var l = localStorage.getItem('lang');
          if (l !== 'en' && l !== 'no') l = /^(nb|nn|no)\b/i.test(navigator.language) ? 'no' : 'en';
          d.lang = l === 'no' ? 'nb' : 'en';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <noscript>This site needs JavaScript to run.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
